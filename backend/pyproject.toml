[project]
name = "findipend-backend"
version = "0.1.0"
description = "Findipend crypto portfolio tracker API"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "fastapi",
    "psycopg2-binary",
    "pydantic",
    "pyjwt[crypto]",
    "sqlalchemy",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
    "testcontainers",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
